<ion-content>
  <ion-grid>
    <ion-row class="ion-margin-top">
      <ion-col size="12" size-md="6" class="ion-margin-bottom">
        <ion-item>
          <ion-label>Pojazd</ion-label>
          <ion-select
            interface="action-sheet"
            cancelText="Anuluj"
            [(ngModel)]="selectedCar"
            (ionChange)="getBillHistory(selectedCar._id)"
          >
            <ion-select-option
              *ngFor="let vehicle of vehicleStrings"
              [value]="vehicle.value"
            >
              {{ vehicle.label }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-list class="scrollable-list">
          <ion-item *ngFor="let service of serviceDataMapped">
            <ion-label>
              <h2>{{ service.date }}</h2>
              <p>Koszt usługi: {{ service.cost }} zł</p>
              <p>Przebieg: {{ service.mileage }} km</p>
              <p>Opis: {{ service.desc || 'Brak opisu' }}</p>
            </ion-label>
          </ion-item>
        </ion-list>

        <ion-item *ngIf="serviceData.length == 0 && selectedCar != undefined">
          <ion-label>Pojazd nie posiada przypisanych serwisów.</ion-label>
        </ion-item>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card *ngIf="serviceData.length > 0" class="ion-margin-bottom mt-0">
          <ion-card-header>
            <ion-card-title>Wydatki według kategorii</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <canvas
              baseChart
              [data]="priceByTypeData"
              [options]="priceByTypeOptions"
              [plugins]="[]"
              [legend]="true"
              [type]="'pie'"
            >
            </canvas>
          </ion-card-content>
        </ion-card>

        <ion-card *ngIf="serviceData.length > 0">
          <ion-card-header>
            <ion-card-title>Wydatki według miesięcy</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-row class="ion-align-items-center">
              <ion-col size="2">
                <ion-button fill="clear" (click)="previousYear()">
                  <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
                </ion-button>
              </ion-col>
              <ion-col size="8">
                <h2 class="ion-text-center ion-no-margin">{{ 'Rok ' + currentYear }}</h2>
              </ion-col>
              <ion-col size="2">
                <ion-button fill="clear" (click)="nextYear()">
                  <ion-icon name="arrow-forward" slot="icon-only"></ion-icon>
                </ion-button>
              </ion-col>
              <ion-col size="12">
                <canvas
                baseChart
                class="h-25rem"
                [data]="priceByMonthData"
                [options]="priceByMonthOptions"
                [legend]="false"
                [plugins]="[]"
                [type]="'bar'"
              >
              </canvas>
              </ion-col>
                
            </ion-row>
            
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
