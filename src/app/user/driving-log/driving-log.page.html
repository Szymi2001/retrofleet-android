<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ng-container *ngFor="let route of myRoutes">
          <ion-card *ngIf="myRoutes.length > 0">
            <ion-card-header>
              <ion-card-title>{{ route.brand + " " + route.model }}</ion-card-title>
              <ion-card-subtitle>{{ route.date }}</ion-card-subtitle>
            </ion-card-header>
            <ion-card-content>
              <ion-item lines="none">
                <ion-icon name="location-outline" slot="start"></ion-icon>
                <ion-label>Z: {{ route.start_location }} </ion-label>
              </ion-item>
      
              <ion-item lines="none">
                <ion-icon name="location-outline" slot="start"></ion-icon>
                <ion-label>Do: {{ route.end_location }} </ion-label>
              </ion-item>
      
              <ion-item lines="none">
                <ion-icon name="map-outline" slot="start"></ion-icon>
                <ion-label>Dystans: {{ route.distance }} </ion-label>
              </ion-item>
      
              <ion-item lines="none">
                <ion-icon name="timer-outline" slot="start"></ion-icon>
                <ion-label>Czas: {{ route.duration }} </ion-label>
              </ion-item>
      
              <ion-item lines="none">
                <ion-icon name="clipboard-outline" slot="start"></ion-icon>
                <ion-label>Status: {{ route.status }} </ion-label>
              </ion-item>
      
              <ion-item lines="none">
                <ion-icon name="document-text-outline" slot="start"></ion-icon>
                <ion-label>Opis: {{ route.description || "Brak opisu" }} </ion-label>
              </ion-item>
            </ion-card-content>
          </ion-card>
        </ng-container>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-item *ngIf="myRoutes.length == 0">
          <ion-icon name="information-circle-outline" slot="start"></ion-icon>
          <ion-label>Dodaj trasę do dziennika.</ion-label>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button size="small" id="inputmodal" (click)="openAddDrivingLogModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
