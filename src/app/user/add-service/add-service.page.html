<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Sortowanie i Filtracja</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list>
              <ion-item>
                <ion-select
                  interface="action-sheet"
                  cancelText="Anuluj"
                  placeholder="Sortuj według typu"
                  [(ngModel)]="selectedType"
                  (ionChange)="onSortChange($event)"
                >
                  <ion-select-option
                    *ngFor="let option of serviceOptions"
                    [value]="option.value"
                  >
                    {{ option.name }}
                  </ion-select-option>
                </ion-select>
                <ion-button fill="clear" (click)="clearFilters()" slot="end">
                  <ion-icon name="filter" slot="icon-only"></ion-icon>
                </ion-button>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-card *ngFor="let service of filteredServices">
          <ion-card-header>
            <ion-card-title
              >{{ service.brand + ' ' + service.model }}</ion-card-title
            >
            <ion-card-subtitle>Typ: {{ service.type }}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <ion-item lines="none">
              <ion-icon name="calendar-outline" slot="start"></ion-icon>
              <ion-label>Data: {{ service.date }}</ion-label>
            </ion-item>
            <ion-item lines="none">
              <ion-icon name="pricetag-outline" slot="start"></ion-icon>
              <ion-label>Cena: {{ service.insertedPrice }} zł</ion-label>
            </ion-item>
            <ion-item lines="none">
              <ion-icon name="speedometer-outline" slot="start"></ion-icon>
              <ion-label>Przebieg: {{ service.mileage }} km</ion-label>
            </ion-item>
            <ion-item lines="none">
              <ion-icon name="text-outline" slot="start"></ion-icon>
              <ion-label
                >Opis: {{ service.description || 'Brak opisu' }}</ion-label
              >
            </ion-item>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-item *ngIf="filteredServices.length == 0">
          <ion-icon name="information-circle-outline" slot="start"></ion-icon>
          <ion-label>Dodaj serwis pojazdu.</ion-label>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button size="small" id="inputmodal" (click)="openDialog()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
