<ion-content>
  <ion-card>
    <ion-card-content>
      <ion-calendar
        #calendar
        [(ngModel)]="date"
        [options]="options"
        (onChange)="onChange($event)"
        format="yyyy-MM-dd"
      >
      </ion-calendar>
    </ion-card-content>
  </ion-card>

  <ion-list [inset]="true">
    <ion-item *ngFor="let event of selectedDateEvents">
      <ion-label>
        <h2>{{ event.title }}</h2>
        <p>
          {{ event.startDate | date: 'yyyy-MM-dd' }} - {{ event.endDate | date: 'yyyy-MM-dd' }}
        </p>
        <p>
          Czas: {{ event.startTime }} - {{ event.endTime }}
        </p>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="selectedDateEvents.length === 0">
      <ion-icon name="information-circle-outline" slot="start"></ion-icon>
      <ion-label>
        {{ "CALENDAR.NO_EVENTS" | translate }}
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button size="small" (click)="openAddEventModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
