<ion-content>
  <ion-segment [(ngModel)]="calendar.mode">
    <ion-segment-button value="month"> Month </ion-segment-button>
    <ion-segment-button value="week"> Week </ion-segment-button>
    <ion-segment-button value="day"> Day </ion-segment-button>
  </ion-segment>
  <ion-row class="ion-align-items-center">
    <ion-col size="2">
      <ion-button fill="clear" (click)="calendarBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-col>
    <ion-col size="8">
      <h2 class="ion-text-center ion-no-margin">{{ viewTitle }}</h2>
    </ion-col>
    <ion-col size="2">
      <ion-button fill="clear" (click)="calendarForward()">
        <ion-icon name="arrow-forward" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-col>
  </ion-row>

  <calendar
    [monthviewDisplayEventTemplate]="template"
    [eventSource]="eventSource"
    [dateFormatter]="calendar.dateFormatter"
    [calendarMode]="calendar.mode"
    [currentDate]="calendar.currentDate"
    (onTitleChanged)="viewTitle = $event"
    (onTimeSelected)="onTimeSelected($event)"
    (onEventSelected)="onEventSelected($event)"
    [locale]="calendar.locale"
    [startingDayWeek]="1"
    [startingDayMonth]="1"
    [startHour]="8"
    [endHour]="20"
    [lockSwipes]="true"
    allDayLabel="Cały dzień"
    noEventsLabel="Brak wydarzeń"
    formatDayHeader="EEEEEE"
  >
  </calendar>

  <ng-template #template let-view="view" let-row="row" let-col="col">
    {{ view.dates[row*7+col].label }}
    <div class="indicator-container">
      <div
        class="event-indicator"
        *ngFor="let e of view.dates[row*7+col].events"
      ></div>
    </div>
  </ng-template>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button size="small" id="inputmodal">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-modal #modal trigger="inputmodal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="modal.dismiss(); this.addEvent.reset();"
              >Anuluj</ion-button
            >
          </ion-buttons>
          <ion-title>Nowe wydarzenie</ion-title>
          <ion-buttons slot="end">
            <ion-button color="primary" strong (click)="submitForm()"
              >Dodaj</ion-button
            >
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <form [formGroup]="addEvent" (ngSubmit)="submitForm()">
          <ion-item>
            <ion-input
              type="text"
              formControlName="title"
              placeholder="Tytuł"
            />
          </ion-item>
          <ion-item>
            <ion-label>Cały dzień</ion-label>
            <ion-toggle formControlName="allDay" />
          </ion-item>
          <ion-item (click)="showStart = !showStart">
            <ion-label>Od</ion-label>
            <ion-text slot="end">{{ formattedStart }}</ion-text>
          </ion-item>
          <ion-datetime
            #start
            *ngIf="showStart"
            formControlName="startTime"
            [presentation]="addEvent.get('allDay')?.value ? 'date' : 'time-date'"
            (ionChange)="startChanged(start.value)"
          >
            <span slot="time-label"> Godzina </span>
          </ion-datetime>

          <ion-item (click)="showEnd = !showEnd">
            <ion-label>Do</ion-label>
            <ion-text slot="end">{{ formattedEnd }}</ion-text>
          </ion-item>
          <ion-datetime
            #end
            *ngIf="showEnd"
            [min]="todayDate"
            formControlName="endTime"
            [presentation]="addEvent.get('allDay')?.value ? 'date' : 'time-date'"
            (ionChange)="endChanged(end.value)"
          >
            <span slot="time-label"> Godzina </span></ion-datetime
          >
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
