<ion-content>
  <ion-row class="ion-align-items-center">
    <ion-col size="2">
      <ion-button fill="clear" (click)="calendarBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-col>
    <ion-col size="8">
      <h2 class="ion-text-center ion-no-margin">{{ viewTitle }}</h2>
    </ion-col>
    <ion-col size="2">
      <ion-button fill="clear" (click)="calendarForward()">
        <ion-icon name="arrow-forward" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-col>
  </ion-row>
  <calendar
    [eventSource]="eventSource"
    [dateFormatter]="calendar.dateFormatter"
    [calendarMode]="calendar.mode"
    [currentDate]="calendar.currentDate"
    (onTitleChanged)="viewTitle = $event"
    [locale]="calendar.locale"
    [startingDayWeek]="1"
    [startingDayMonth]="1"
    allDayLabel="Cały dzień"
    noEventsLabel="Brak wydarzeń"
    formatDayHeader="EEEEEE"
  >
  </calendar>

  <div *ngIf="eventSource.length === 0" class="no-events-message">
    <ion-text color="medium">
      <h2>Brak wydarzeń</h2>
      <p>Nie masz jeszcze żadnych wydarzeń. Dodaj nowe wydarzenie, aby je zobaczyć tutaj.</p>
    </ion-text>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button size="small" id="inputmodal">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-modal trigger="inputmodal" [initialBreakpoint]="0.5">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Dodaj wydarzenie</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <form [formGroup]="addEvent" (ngSubmit)="onSubmit()" class="ion-padding">
          <ion-item>
            <ion-textarea
              placeholder="Tytuł wydarzenia"
              formControlName="title"
              autoGrow
              maxlength="100"
            ></ion-textarea>
          </ion-item>
      
          <ion-item>
            <ion-label>Cały dzień</ion-label>
            <ion-checkbox
              formControlName="allDay"
            ></ion-checkbox>
          </ion-item>
      
          <ion-item id="startTime" [ngClass]="{ 'disabled-item': addEvent.get('allDay')?.value }">
            <ion-label>Od:</ion-label>
            <ion-note slot="end">{{
              addEvent.get("startTime")?.value | date : "dd/MM/yyyy HH:mm"
            }}</ion-note>
          </ion-item>
          <ion-modal trigger="startTime" [cssClass]="'bottom-end'">
            <ng-template>
              <ion-datetime
                id="date"
                presentation="date-time"
                size="cover"
                showDefaultButtons="true"
                cancelText="Anuluj"
                doneText="Zatwierdź"
                formControlName="startTime"
              ></ion-datetime>
            </ng-template>
          </ion-modal>

          <ion-item id="endTime" [ngClass]="{ 'disabled-item': addEvent.get('allDay')?.value }">
            <ion-label>Do:</ion-label>
            <ion-note slot="end">{{
              addEvent.get("endTime")?.value | date : "dd/MM/yyyy HH:mm"
            }}</ion-note>
          </ion-item>
          <ion-modal trigger="endTime" [cssClass]="'bottom-end'">
            <ng-template>
              <ion-datetime
                id="date"
                presentation="date-time"
                size="cover"
                showDefaultButtons="true"
                cancelText="Anuluj"
                doneText="Zatwierdź"
                formControlName="endTime"
              ></ion-datetime>
            </ng-template>
          </ion-modal>
      
          <ion-button expand="full" type="submit">
            Zapisz
          </ion-button>
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
