<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">Anuluj</ion-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Wydarzenie</ion-title>
    <ion-buttons slot="end">
      <ion-button color="primary" strong (click)="submitForm()">Zatwierdź</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-card>
    <ion-card-content>
      <form [formGroup]="eventForm" (ngSubmit)="submitForm()">
        <ion-item>
          <ion-input
            type="text"
            label="Tytuł"
            labelPlacement="floating"
            formControlName="title"
          />
        </ion-item>
        <ion-text
          color="danger"
          *ngFor="let validation of validationMessages.title"
        >
          <div
            *ngIf="
              eventForm.controls['title'].hasError(validation.type) &&
              eventForm.controls['title'].touched
            "
            class="error-message"
          >
            <ion-icon name="information-circle-outline"></ion-icon>
            <span>{{ validation.message }}</span>
          </div>
        </ion-text>
        <ion-item>
          <ion-label>Od</ion-label>
          <ion-datetime-button datetime="startDatetime"></ion-datetime-button>
        </ion-item>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              id="startDatetime"
              formControlName="startDate"
            ></ion-datetime>
          </ng-template>
        </ion-modal>

        <ion-item>
          <ion-label>Do</ion-label>
          <ion-datetime-button datetime="endDatetime"></ion-datetime-button>
        </ion-item>
        <ion-modal [keepContentsMounted]="true">
          <ng-template>
            <ion-datetime
              id="endDatetime"
              formControlName="endDate"
            ></ion-datetime>
          </ng-template>
        </ion-modal>

        <ion-text
          color="danger"
          *ngFor="let validation of validationMessages.endDate"
        >
          <div
            *ngIf="eventForm.hasError(validation.type)"
            class="error-message"
          >
            <ion-icon name="information-circle-outline"></ion-icon>
            <span>{{ validation.message }}</span>
          </div>
        </ion-text>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
