<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card *ngFor="let fueling of myFuelings">
          <ion-item-sliding #slidingItem>
            <ion-item class="ion-text-wrap">
              <ion-card-header>
                <ion-card-title
                  >{{ fueling.brand + ' ' + fueling.model }}</ion-card-title
                >
                <ion-card-subtitle
                  >Forma płatności: {{ fueling.transactionType
                  }}</ion-card-subtitle
                >
              </ion-card-header>

              <ion-card-content>
                <ion-item lines="none">
                  <ion-icon name="calendar-outline" slot="start"></ion-icon>
                  <ion-label>Data: {{ fueling.date }}</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-icon name="pricetag-outline" slot="start"></ion-icon>
                  <ion-label>Cena: {{ fueling.price }} zł</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-icon name="speedometer-outline" slot="start"></ion-icon>
                  <ion-label>Przebieg: {{ fueling.mileage }} km</ion-label>
                </ion-item>
                <ion-item lines="none">
                  <ion-icon
                    name="document-text-outline"
                    slot="start"
                  ></ion-icon>
                  <ion-label
                    >Opis: {{ fueling.description || 'Brak opisu' }}</ion-label
                  >
                </ion-item>
              </ion-card-content>
            </ion-item>

            <ion-item-options side="end">
              <ion-item-option color="secondary">
                <ion-icon
                  slot="icon-only"
                  color="light"
                  name="help-circle"
                ></ion-icon>
              </ion-item-option>
            </ion-item-options>
          </ion-item-sliding>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button
      size="small"
      id="inputmodal"
      (click)="openAddFuelingModal()"
    >
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
