<ion-content padding>
  <ion-grid>
    <ion-row class="ion-justify-content-center ion-margin-top">
      <ion-col size="12" size-md="6" size-lg="4">
        <ion-card class="ion-text-center">
          <ion-buttons slot="start">
            <ion-back-button default-href="#"></ion-back-button>
          </ion-buttons>
          <ion-card-header>
            <ion-card-title>{{ 'REGISTER.TITLE' | translate }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
              <ion-item>
                <ion-icon name="person-outline" slot="start"></ion-icon>
                <ion-input
                  placeholder="{{ 'REGISTER.LOGIN_PLACEHOLDER' | translate }}"
                  type="text"
                  formControlName="username"
                >
                </ion-input>
              </ion-item>
              <ion-text color="danger" *ngFor="let validation of validationMessages.username">
                <div *ngIf="registerForm.controls['username'].hasError(validation.type) && registerForm.controls['username'].touched" class="error-message">
                  <ion-icon name="information-circle-outline"></ion-icon>
                  <span>{{ validation.message }}</span>
                </div>
              </ion-text>

              <ion-item class="ion-margin-top">
                <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
                <ion-input
                  placeholder="{{ 'REGISTER.PASSWORD_PLACEHOLDER' | translate }}"
                  type="password"
                  formControlName="password"
                >
                </ion-input>
              </ion-item>
              <ion-text color="danger" *ngFor="let validation of validationMessages.password">
                <div *ngIf="registerForm.controls['password'].hasError(validation.type) && registerForm.controls['password'].touched" class="error-message">
                  <ion-icon name="information-circle-outline"></ion-icon>
                  <span>{{ validation.message }}</span>
                </div>
              </ion-text>

              <ion-item class="ion-margin-top">
                <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
                <ion-input
                  placeholder="{{ 'REGISTER.REPEAT_PASSWORD_PLACEHOLDER' | translate }}"
                  type="password"
                  formControlName="repeatPassword"
                >
                </ion-input>
              </ion-item>
              <ion-text color="danger" *ngFor="let validation of validationMessages.repeatPassword">
                <div *ngIf="registerForm.controls['repeatPassword'].hasError(validation.type) && registerForm.controls['repeatPassword'].touched" class="error-message">
                  <ion-icon name="information-circle-outline"></ion-icon>
                  <span>{{ validation.message }}</span>
                </div>
              </ion-text>

              <ion-item class="ion-margin-top">
                <ion-icon name="mail-outline" slot="start"></ion-icon>
                <ion-input
                  placeholder="Email"
                  type="email"
                  formControlName="email"
                >
                </ion-input>
              </ion-item>
              <ion-text color="danger" *ngFor="let validation of validationMessages.email">
                <div *ngIf="registerForm.controls['email'].hasError(validation.type) && registerForm.controls['email'].touched" class="error-message">
                  <ion-icon name="information-circle-outline"></ion-icon>
                  <span>{{ validation.message }}</span>
                </div>
              </ion-text>

              <ion-button expand="block" type="submit" class="ion-margin-top">
                {{ 'REGISTER.BUTTON_LABEL' | translate }}
              </ion-button>
            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
