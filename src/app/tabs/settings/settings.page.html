<ion-content padding>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Wyświetlanie</ion-card-title>
    </ion-card-header>
  
    <ion-card-content>
      
      <ion-item>
        <ion-icon
      slot="start"
      [name]="paletteToggle ? 'sunny-outline' : 'moon-outline'"
    ></ion-icon>
        <ion-toggle
          [(ngModel)]="paletteToggle"
          (ionChange)="toggleDarkModeChange($event)"
          >Dark Mode</ion-toggle
        >
      </ion-item>

      <ion-item>
        <ion-label>Rozmiar czcionki</ion-label>
        <ion-segment [(ngModel)]="fontSize" (ionChange)="onFontSizeChange($event)">
          <ion-segment-button value="small">
            Mały
          </ion-segment-button>
          <ion-segment-button value="medium">
            Średni
          </ion-segment-button>
          <ion-segment-button value="large">
            Duży
          </ion-segment-button>
        </ion-segment>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-content>
