<ion-app>
  <!-- Pasek nawigacyjny -->
  <ion-header>
    <ion-toolbar>
      <ion-title>{{ pageTitle }}</ion-title>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-buttons slot="end" tab="profile" *ngIf="isLoggedIn">
        <ion-button (click)="openProfileMenu()">
            <ion-avatar>
              <img [src]="profileImage[0] || '/assets/images/profile_icon.png'" alt="Zdjęcie profilowe" />
            </ion-avatar>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Główna zawartość -->
  <ion-content>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-content>

  <!-- Menus -->
  <ion-menu side="start" menuId="main-menu" contentId="main-content" class="menu">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="dismiss()">
            <ion-icon slot="icon-only" name="close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ng-container *ngFor="let item of mainMenuItems">
          <!-- Renderowanie dividera -->
          <ng-container *ngIf="isDivider(item)">
            <ion-item-divider></ion-item-divider>
          </ng-container>
      
          <!-- Renderowanie elementu menu -->
          <ng-container *ngIf="!isDivider(item)">
            <ion-item lines="none" button (click)="goToPage(item.path, item.action, 'main-menu')">
              <ion-icon slot="start" [name]="item.icon"></ion-icon>
              {{ item.title }}
            </ion-item>
          </ng-container>
        </ng-container>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-menu side="end" menuId="profile-menu" contentId="main-content" class="menu">
    <ion-header>
      <ion-toolbar>
        <ion-title>
          <ion-item lines="none" class="ion-no-padding" button (click)="goToProfile()">
            <ion-avatar>
              <img [src]="profileImage[0] || '/assets/images/profile_icon.png'" alt="Zdjęcie profilowe" />
            </ion-avatar>
            <ion-label class="ion-margin-start">Szymon</ion-label>
          </ion-item>
            
        </ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="dismiss()">
            <ion-icon slot="icon-only" name="close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-content>
        <ion-list>
          <ng-container *ngFor="let item of profileMenuItems">
            <!-- Renderowanie dividera -->
            <ng-container *ngIf="isDivider(item)">
              <ion-item-divider></ion-item-divider>
            </ng-container>
        
            <!-- Renderowanie elementu menu -->
            <ng-container *ngIf="!isDivider(item)">
              <ion-item lines="none" button (click)="goToPage(item.path, item.action, 'profile-menu')">
                <ion-icon slot="start" [name]="item.icon"></ion-icon>
                {{ item.title }}
              </ion-item>
            </ng-container>
          </ng-container>
        </ion-list>
      </ion-content>
    </ion-content>
  </ion-menu>
</ion-app>
