<ion-app>
  <!-- Pasek nawigacyjny -->
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start" *ngIf="showBackButton">
        <ion-button (click)="goBack()">
          <ion-icon name="arrow-back-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>{{ pageTitle }}</ion-title>
      <ion-buttons slot="end" *ngIf="isLoggedIn">
        <ion-button (click)="toggleDarkMode()" class="settings-btn">
          <ion-icon
            [name]="theme ? 'sunny-outline' : 'moon-outline'"
          ></ion-icon>
        </ion-button>
        <ion-button
          *ngIf="showProfileButton"
          (click)="navigateTo('/profile')"
          class="profile-btn"
        >
          <ion-avatar>
            <ion-icon name="person-circle-outline"></ion-icon>
          </ion-avatar>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Główna zawartość -->
  <ion-content>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-content>

  <ion-tab-bar slot="bottom" *ngIf="isLoggedIn">
    <ion-tab-button
      routerLink="/myfleet"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="car-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button
      routerLink="/driving-log"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="map-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button
      routerLink="/calendar"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="calendar-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button
      routerLink="/services"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="build-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button
      routerLink="/fuelings"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="speedometer-outline"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>

  <ion-tab-bar slot="bottom" *ngIf="!isLoggedIn">
    <ion-tab-button
      routerLink="/login"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="person-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button
      routerLink="/register"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="person-add-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button
      routerLink="/settings"
      routerLinkActive="active"
      routerDirection="root"
    >
      <ion-icon name="settings-outline"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-app>
