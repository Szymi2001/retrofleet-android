<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title
              >Dane użytkownika</ion-card-title
            >
          </ion-card-header>
          <ion-card-content>
            <ion-item lines="none">
              <ion-label>
                <ion-note *ngIf="userInfo?.login">
                  Nazwa użytkownika: {{ userInfo.login }}
                  <br />
                  Imię: {{ userInfo.name }}
                  <br />
                  Nazwisko: {{ userInfo.surname }} <br />
                  Email: {{ userInfo.email }}
                </ion-note>
              </ion-label>
            </ion-item>

            <ion-button
              expand="block"
              color="primary"
              type="submit"
              (click)="setOpenChangeDataModal(true)"
              class="ion-margin-top"
            >
              <ion-icon slot="start" name="pencil-outline"></ion-icon>
              ZMIEŃ DANE
            </ion-button>
            <ion-modal [isOpen]="isChangeDataModalOpen">
              <ng-template>
                <ion-header>
                  <ion-toolbar>
                    <ion-title
                      >Zmiana danych</ion-title
                    >
                    <ion-buttons slot="end">
                      <ion-button (click)="setOpenChangeDataModal(false)">
                        <ion-icon
                          slot="icon-only"
                          name="close-outline"
                        ></ion-icon>
                      </ion-button>
                    </ion-buttons>
                  </ion-toolbar>
                </ion-header>
                <ion-content class="ion-padding">
                  <form
                    [formGroup]="changeUserInfo"
                    (ngSubmit)="changeUserInfoOnSubmit()"
                  >
                    <ion-item>
                      <ion-input
                        label="Imię"
                        labelPlacement="floating"
                        type="text"
                        formControlName="name"
                      ></ion-input>
                    </ion-item>

                    <ion-item>
                      <ion-input
                        label="Nazwisko"
                        labelPlacement="floating"
                        type="text"
                        formControlName="surname"
                      ></ion-input>
                    </ion-item>

                    <ion-button
                      expand="block"
                      type="submit"
                      class="ion-margin-top"
                    >
                      <ion-icon
                        slot="start"
                        name="checkmark-outline"
                      ></ion-icon>
                      ZATWIERDŹ
                    </ion-button>
                  </form>
                </ion-content>
              </ng-template>
            </ion-modal>
            <ion-button
              expand="block"
              color="warning"
              type="submit"
              (click)="setOpenChangePasswordModal(true)"
              class="ion-margin-top"
            >
              <ion-icon slot="start" name="key-outline"></ion-icon>
              ZMIEŃ HASŁO
            </ion-button>
            <ion-modal [isOpen]="isChangePasswordModalOpen">
              <ng-template>
                <ion-header>
                  <ion-toolbar>
                    <ion-title
                      >Zmiana hasła</ion-title
                    >
                    <ion-buttons slot="end">
                      <ion-button (click)="setOpenChangePasswordModal(false)">
                        <ion-icon
                          slot="icon-only"
                          name="close-outline"
                        ></ion-icon>
                      </ion-button>
                    </ion-buttons>
                  </ion-toolbar>
                </ion-header>
                <ion-content class="ion-padding">
                  <form
                    [formGroup]="changePassword"
                    (ngSubmit)="changePasswordOnSubmit()"
                  >
                    <ion-item>
                      <ion-input
                        label="Wprowadź stare hasło"
                        labelPlacement="floating"
                        type="password"
                        formControlName="old_password"
                      ></ion-input>
                    </ion-item>

                    <ion-item>
                      <ion-input
                        label="Wprowadź nowe hasło"
                        labelPlacement="floating"
                        type="password"
                        formControlName="new_password"
                      ></ion-input>
                    </ion-item>

                    <ion-item>
                      <ion-input
                        label="Potwórz nowe hasło"
                        labelPlacement="floating"
                        type="password"
                        formControlName="repeat_password"
                      ></ion-input>
                    </ion-item>

                    <ion-button
                      expand="block"
                      type="submit"
                      color="warning"
                      class="ion-margin-top"
                    >
                      <ion-icon
                        slot="start"
                        name="checkmark-outline"
                      ></ion-icon>
                      ZATWIERDŹ
                    </ion-button>
                  </form>
                </ion-content>
              </ng-template>
            </ion-modal>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size="12">
        <ion-card>
          <ion-card-header>
            <ion-card-title
              >Usuń konto</ion-card-title
            >
          </ion-card-header>
          <ion-card-content>
            <form
              [formGroup]="deleteAccount"
              (ngSubmit)="onDeleteAccountSubmit()"
            >
              <ion-item>
                <ion-input
                  type="password"
                  formControlName="password"
                  placeholder="Wprowadź hasło"
                >
                </ion-input>
              </ion-item>
              <ion-button
                expand="block"
                color="danger"
                type="submit"
                class="ion-margin-top"
              >
                <ion-icon slot="start" name="trash-outline"></ion-icon>
                USUŃ KONTO
              </ion-button>
            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size="12">
        <ion-card>
          <ion-button (click)="logout()" expand="block" color="secondary">
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            Wyloguj się
          </ion-button>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
